<!doctype html><html lang=uk><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CRUD Students</title><style>*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}body{color:#e1e1e6;background:#121214;margin:0;padding:20px}.container{background:#202024;border-radius:8px;max-width:900px;margin:0 auto;padding:24px}h1,h2{text-align:center;color:#00875f}h2{text-align:left;margin-top:30px;font-size:18px}button{color:#fff;cursor:pointer;background:#00875f;border:none;border-radius:4px;padding:10px 16px;font-weight:700}button:hover{background:#00b37e}.students-grid{flex-wrap:wrap;gap:16px;margin-top:20px;display:flex}.student-card{background:#29292e;border:1px solid #323238;border-radius:6px;flex-direction:column;gap:8px;width:260px;padding:16px;font-size:14px;display:flex}.student-card input{color:#fff;background:#121214;border:1px solid #323238;border-radius:4px;width:100%;padding:4px 6px}form{background:#29292e;border:1px solid #323238;border-radius:6px;flex-direction:column;gap:8px;padding:16px;font-size:14px;display:flex}form label{color:#a8a8b3;font-size:13px}form input[type=email],form input[type=number],form input[type=text]{color:#fff;background:#121214;border:1px solid #323238;border-radius:4px;width:100%;margin-top:4px;padding:8px}.action-btns{gap:6px;margin-top:8px;display:flex}.action-btns button{flex:1;padding:6px 10px;font-size:12px}.delete-btn{background:#f75a68}.delete-btn:hover{background:#e53e3e}</style><script defer src=bundle.js></script></head><body><div class=container><h1>Список студентів</h1><button id=get-students-btn>Отримати студентів</button><div id=students-container class=students-grid></div><h2>Додати нового студента</h2><form id=add-student-form><label>Ім'я <input id=name required></label> <label>Вік <input type=number id=age required></label> <label>Курс <input id=course required></label> <label>Навички <input id=skills required></label> <label>Email <input type=email id=email required></label> <label><input type=checkbox id=isEnrolled> Записаний на курс</label> <button id=sub type=submit>Додати студента</button></form></div><script src=index.js type=module></script></body></html>
